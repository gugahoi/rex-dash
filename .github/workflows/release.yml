name: Release

# Create a GitHub Release and update the Homebrew formula.
# Trigger by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
# Or run manually from the Actions tab, supplying a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out manual tag if it exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git checkout "${TAG}"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '20.1.0'
      - run: ./rex-dash --test
      - run: node --test test/*.test.js
      - run: ./scripts/test-package.sh --brew

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9] ]]; then
            echo "Release tag must start with v, for example v1.0.0." >&2
            exit 1
          fi
          echo "tag=${TAG}" >>"${GITHUB_OUTPUT}"

      - name: Check out manual tag if it exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git checkout "${TAG}"
          else
            echo "Tag ${TAG} does not exist yet; the release will create it from this commit."
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Run self-check and tests
        run: |
          ./rex-dash --test
          node --test test/*.test.js

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          elif git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes --target "${GITHUB_SHA}"
          fi

      # After the release, so a manual run has created the tag the tarball is cut from.
      - name: Compute tarball sha
        id: tarball
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          SHA256="$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" | shasum -a 256 | cut -d ' ' -f 1)"
          echo "sha256=${SHA256}" >>"${GITHUB_OUTPUT}"

      - name: Generate Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOMEBREW_TAP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: gugahoi
          repositories: homebrew-tap

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/gugahoi/homebrew-tap.git" homebrew-tap
          ./scripts/write-formula.sh "${TAG}" "${SHA256}" homebrew-tap/Formula/rex-dash.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/rex-dash.rb
          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
          else
            git -C homebrew-tap commit -m "Update rex-dash formula to ${TAG}"
            git -C homebrew-tap push
          fi
