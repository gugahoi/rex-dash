name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['20.1.0', '24.21.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: ./rex-dash --test
      - run: node --test test/*.test.js
      - run: for script in scripts/*.sh; do bash -n "$script"; done

  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: ubuntu-24.04, platform: linux-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - run: npm ci
      - run: ./scripts/build-binary.sh v0.0.0 dist
      - run: ./scripts/test-binary.sh dist/rex-dash
      - run: REX_DASH_BIN="$PWD/dist/rex-dash" node --test test/cli.test.js
      - name: Test the actual archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform + "-" + process.arch')" = "$PLATFORM"
          (cd dist && ../scripts/sha256.sh -c "rex-dash-v0.0.0-${PLATFORM}.tar.gz.sha256")
          mkdir unpacked
          tar -xzf "dist/rex-dash-v0.0.0-${PLATFORM}.tar.gz" -C unpacked
          ./scripts/test-binary.sh unpacked/rex-dash
      # Only a binary that passed its tests is kept, for scripts/try-pr.sh. overwrite lets a rerun replace it.
      - uses: actions/upload-artifact@v7
        with:
          name: rex-dash-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 14
          if-no-files-found: error
          overwrite: true
      - name: Say how to try this PR
        if: github.event_name == 'pull_request' && matrix.platform == 'linux-x64'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Try this PR'
            echo
            echo "Each platform's binary is kept with this run for 14 days, once it passes its tests. To download yours, check it and run it, from a checkout:"
            echo
            echo '```sh'
            echo "scripts/try-pr.sh $PR --run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - run: npm ci
      - run: ./scripts/test-package.sh --brew
